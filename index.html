<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UtilOps GMP</title>
<meta name="description" content="App vận hành hệ thống phụ trợ – Tổ Phụ trợ 2, Phenikaa Pharma">
<meta name="theme-color" content="#0e4a50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UtilOps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{height:100%;margin:0}
body{background:#0e4a50;color:#fff;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px))}
.box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:420px}
.logo{width:88px;height:88px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#5cd6e0;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.m{color:#b9d6d8;font-size:13.5px;margin:0}
a,button{color:#05292c;background:#5cd6e0;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="icon-192.png" alt="UtilOps">
  <div><b style="font-size:20px">UtilOps GMP</b><p class="m">Tổ Hệ thống Phụ trợ 2 · Phenikaa Pharma</p></div>
  <div class="spin" id="sp" aria-hidden="true"></div>
  <p class="m" id="msg">Đang tải phần mềm…</p>
  <button id="retry" hidden>Thử lại</button>
  <a id="old" hidden target="_top">Mở bằng đường dẫn dự phòng</a>
</main>
<script>
(function () {
  /* Máy chủ UtilOps (Google Apps Script – dữ liệu trên Google Drive). App chạy trực tiếp, gọi máy chủ qua API JSON. */
  var API = 'https://script.google.com/macros/s/AKfycbyhXcvwH1dw-ZScNjJM4t5989uoCrk2-IdbljmkybYoCgXJuCQccAogU9Pla7Mq-ONh/exec';
  var K = 'uo_app', KV = 'uo_app_v';
  var $ = function (i) { return document.getElementById(i); };
  $('old').href = API;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function call(fn, args) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), cache: 'no-store' })
      .then(function (r) { return r.json(); }).then(function (j) { if (j.ok) return j.r; throw new Error(j.err); });
  }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(v, h) { try { localStorage.setItem(K, h); localStorage.setItem(KV, v); } catch (e) {} }

  /* Phần chèn vào trang phần mềm: địa chỉ API, manifest/biểu tượng (để cài app), tự kiểm tra bản mới, nút cài app */
  var S = 'script';
  var INJ =
    '<' + S + '>window.UTILOPS_API=' + JSON.stringify(API) + ';</' + S + '>' +
    '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon-48.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">' +
    '<meta name="theme-color" content="#0e4a50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UtilOps">' +
    '<' + S + '>(' + function (API, K, KV) {
      function call(fn) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: [] }), cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) return j.r; throw new Error(j.err); }); }
      function toast(html) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:9999;background:#0e4a50;color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font:13.5px Segoe UI,Arial,sans-serif;display:flex;gap:10px;align-items:center'; d.innerHTML = html; document.body.appendChild(d); return d; }
      /* bản giao diện mới: tải ngầm, áp dụng khi mở lại hoặc bấm Tải lại */
      setTimeout(function () {
        var v = null; try { v = localStorage.getItem(KV); } catch (e) {}
        call('appInfo').then(function (i) {
          if (!i.v || i.v === v) return;
          return call('appHtml').then(function (a) {
            try { localStorage.setItem(K, a.html); localStorage.setItem(KV, a.v); } catch (e) {}
            var t = toast('Đã có phiên bản UtilOps mới. <button style="background:#5cd6e0;color:#05292c;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">Tải lại</button>');
            t.querySelector('button').onclick = function () { location.reload(); };
          });
        }).catch(function () {});
      }, 5000);
      /* nút cài app (Chrome/Edge máy tính & Android) */
      var dp = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); dp = e;
        if (matchMedia('(display-mode: standalone)').matches) return;
        var t = toast('<span>Cài UtilOps lên máy này?</span><button style="background:#5cd6e0;color:#05292c;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">Cài app</button><span style="cursor:pointer;opacity:.7;padding:0 4px" title="Đóng">✕</span>');
        t.querySelector('button').onclick = function () { dp.prompt(); dp.userChoice.then(function () { t.remove(); }); };
        t.querySelectorAll('span')[1].onclick = function () { t.remove(); };
      });
    }.toString() + ')(' + JSON.stringify(API) + ',' + JSON.stringify(K) + ',' + JSON.stringify(KV) + ');</' + S + '>';

  function boot(h) {
    h = h.replace(/<head>/i, '<head>' + INJ);
    document.open(); document.write(h); document.close();
  }
  function fail(e) {
    $('sp').hidden = true;
    $('msg').textContent = (navigator.onLine === false ? 'Không có kết nối mạng. ' : 'Không tải được phần mềm. ') + 'Kiểm tra Wi-Fi/4G rồi thử lại.';
    $('retry').hidden = false; $('old').hidden = false;
  }
  function first() {
    $('sp').hidden = false; $('retry').hidden = true; $('msg').textContent = 'Đang tải phần mềm lần đầu (khoảng vài giây)…';
    call('appHtml').then(function (a) { put(a.v, a.html); boot(a.html); }).catch(fail);
  }
  $('retry').onclick = first;

  var cached = get(K);
  if (cached) setTimeout(function () { boot(cached); }, 0);   /* mở ngay từ bản đã lưu trên máy (sau khi trang khởi động phân tích xong để thay toàn bộ tài liệu) – kiểm tra bản mới chạy ngầm */
  else first();
})();
</script>
</body>
</html>
